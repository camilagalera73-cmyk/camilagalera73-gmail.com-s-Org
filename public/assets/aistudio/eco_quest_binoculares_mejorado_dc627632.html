<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eco Quest | ¿Sabías que?</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --green: #405b24;
      --green-dark: #30451b;
      --ink: #17130f;
      --ease-out: cubic-bezier(.2, .75, .25, 1);
      --ease-spring: cubic-bezier(.34, 1.3, .5, 1);
      --dur: 950ms;

      /*
        Geometría del estado abierto (en % de la escena).
        --s    escala de cada mitad al abrirse
        --d    cuánto se corre cada mitad desde el centro
        --cy   centro vertical del hueco que dejan las mitades
        --ch   alto de ese hueco
        --tuck cuánto entra el papel por detrás de cada mitad
      */
      --s: .65;
      --d: 16%;
      --cy: 45.7%;
      --ch: 23%;
      --tuck: 2.2%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #fff;
      font-family: Georgia, "Times New Roman", serif;
    }

    .widget {
      width: min(100%, 920px);
      text-align: center;
    }

    .scene {
      position: relative;
      width: 100%;
      aspect-ratio: 1472 / 832;
      overflow: hidden;
      isolation: isolate;
      background: #fff;
      perspective: 1400px;
      container-type: inline-size;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* Papel: queda detrás de las dos mitades y llena el hueco. */
    .paper {
      position: absolute;
      z-index: 1;
      left: 50%;
      top: var(--cy);
      width: calc(var(--d) * 2 + var(--tuck) * 2);
      min-height: var(--ch);
      padding: .8cqw calc(var(--tuck) + 3.2%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background:
        repeating-linear-gradient(
          0deg,
          transparent 0 3px,
          rgba(130, 103, 48, .045) 4px,
          transparent 5px
        ),
        linear-gradient(90deg, #ead9a8, #f7e9bf 10%, #f7e9bf 90%, #ead9a8);
      border-block: 1px solid rgba(125, 99, 48, .22);
      opacity: 0;
      /* Se desenrolla desde el centro hacia los costados. */
      clip-path: inset(0 50% 0 50%);
      transform: translate(-50%, -50%);
      transition:
        clip-path 850ms var(--ease-out),
        opacity 250ms ease;
      overflow: hidden;
    }

    /* Puntas enrolladas del papel: quedan por delante de cada mitad. */
    .tab {
      --tab-w: calc(var(--tuck) + .4%);
      position: absolute;
      z-index: 3;
      top: calc(var(--cy) - var(--ch) / 2 + var(--ch) * .05);
      width: var(--tab-w);
      height: calc(var(--ch) * .27);
      background: linear-gradient(180deg, #f6e8bd, #ead9a8);
      border: 1px solid rgba(125, 99, 48, .22);
      opacity: 0;
      transform: scaleX(0);
      transition: transform 500ms var(--ease-out), opacity 250ms ease;
      pointer-events: none;
    }
    .tab-l {
      right: calc(50% + var(--d));
      border-right: 0;
      border-radius: 999px 0 0 999px / 50% 0 0 50%;
      transform-origin: right center;
    }
    .tab-r {
      left: calc(50% + var(--d));
      border-left: 0;
      border-radius: 0 999px 999px 0 / 0 50% 50% 0;
      transform-origin: left center;
    }

    /* Brillo que cruza el papel una vez al terminar de abrirse. */
    .paper .shine {
      position: absolute;
      inset: 0;
      background: linear-gradient(100deg, transparent 35%, rgba(255, 255, 255, .5) 50%, transparent 65%);
      transform: translateX(-120%);
      pointer-events: none;
    }

    .paper h2 {
      margin: 0 0 .35em;
      color: var(--ink);
      font: 800 clamp(10px, 2.1cqw, 24px)/1.1 Arial, sans-serif;
      letter-spacing: .04em;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 500ms ease, transform 600ms var(--ease-out);
    }

    .paper p {
      max-width: 100%;
      margin: 0;
      color: var(--ink);
      font-weight: 700;
      font-size: clamp(10px, 2.05cqw, 22px);
      line-height: 1.25;
    }

    /* Palabras que aparecen una por una. */
    .paper .w {
      display: inline-block;
      opacity: 0;
      transform: translateY(.5em);
      filter: blur(3px);
      transition:
        opacity 450ms ease,
        transform 550ms var(--ease-out),
        filter 450ms ease;
    }

    .binoculars {
      position: absolute;
      z-index: 2;
      inset: 0;
      pointer-events: none;
      transform-style: preserve-3d;
      /* Parallax suave con el puntero (solo cerrado). */
      transform:
        rotateX(calc(var(--py, 0) * -2deg))
        rotateY(calc(var(--px, 0) * 3deg));
      transition: transform 400ms ease-out;
    }

    /* Flotación leve mientras está cerrado. */
    .float {
      position: absolute;
      inset: 0;
      animation: float 4.5s ease-in-out infinite;
    }

    .half {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform-origin: 50% 50%;
      transition: transform var(--dur) var(--ease-spring);
      will-change: transform;
    }

    .half img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      mix-blend-mode: multiply;
    }

    .left  { clip-path: inset(0 50% 0 0); }
    .right { clip-path: inset(0 0 0 50%); }

    /* Abierto: cada mitad se achica y se separa, sin girar. */
    .scene.open .left  { transform: translateX(calc(var(--d) * -1)) scale(var(--s)); }
    .scene.open .right { transform: translateX(var(--d)) scale(var(--s)); }

    .scene.open .binoculars { transform: none; }
    .scene.open .float { animation: none; }

    .scene.open .paper {
      opacity: 1;
      clip-path: inset(0 0 0 0);
      transition-delay: 350ms;
    }

    .scene.open .tab {
      opacity: 1;
      transform: scaleX(1);
      transition-delay: 900ms;
    }

    .scene.open .paper .shine {
      animation: shine 1100ms ease-out 1100ms 1 both;
    }

    .scene.open .paper h2 {
      opacity: 1;
      transform: translateY(0);
      transition-delay: 800ms;
    }

    .scene.open .paper .w {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
      transition-delay: calc(950ms + var(--i) * 55ms);
    }

    /* Al cerrar, todo desaparece rápido y sin retraso. */
    .scene:not(.open) .paper,
    .scene:not(.open) .tab,
    .scene:not(.open) .paper h2,
    .scene:not(.open) .paper .w {
      transition-delay: 0ms;
      transition-duration: 300ms;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-1%); }
    }

    @keyframes shine {
      from { transform: translateX(-120%); }
      to   { transform: translateX(120%); }
    }

    .controls {
      display: flex;
      justify-content: center;
      margin-top: 18px;
    }

    button {
      position: relative;
      overflow: hidden;
      border: 0;
      border-radius: 999px;
      padding: 12px 25px;
      background: var(--green);
      color: white;
      font: 600 15px Arial, sans-serif;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(64, 91, 36, .3);
      transition: background .2s ease, transform .2s ease, box-shadow .2s ease;
    }
    button:hover {
      background: var(--green-dark);
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(64, 91, 36, .35);
    }
    button:active { transform: translateY(0) scale(.97); }
    button:focus-visible {
      outline: 3px solid #a5bd75;
      outline-offset: 4px;
    }

    button .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, .4);
      transform: scale(0);
      animation: ripple 600ms ease-out forwards;
      pointer-events: none;
    }
    @keyframes ripple { to { transform: scale(4); opacity: 0; } }

    button .label {
      display: inline-block;
      transition: opacity 180ms ease, transform 180ms ease;
    }
    button .label.swap { opacity: 0; transform: translateY(6px); }

    /* Celulares: escena más alta y apertura adaptada. */
    @media (max-width: 520px) {
      :root {
        --s: .7;
        --d: 22%;
        --cy: 45.4%;
        --ch: 24.8%;
        --tuck: 2.5%;
      }
      body { padding: 12px; }
      .scene { aspect-ratio: 1472 / 1000; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition-duration: .01ms !important;
        transition-delay: 0ms !important;
      }
      .binoculars { transform: none; }
      .paper .w { filter: none; }
    }
  </style>
</head>

    <div class="controls">
      <button id="toggle" type="button" aria-expanded="false">
        <span class="label">Descubrir curiosidad</span>
      </button>
    </div>
  </main>

  <script>
    const scene = document.getElementById("scene");
    const button = document.getElementById("toggle");
    const label = button.querySelector(".label");
    const fact = document.getElementById("fact");
    const binoculars = scene.querySelector(".binoculars");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    // Divide el texto en palabras para animarlas una por una.
    const factText = fact.textContent.trim().replace(/\s+/g, " ");
    fact.setAttribute("aria-label", factText);
    fact.textContent = "";
    factText.split(" ").forEach((word, i) => {
      const span = document.createElement("span");
      span.className = "w";
      span.style.setProperty("--i", i);
      span.setAttribute("aria-hidden", "true");
      span.textContent = word;
      fact.appendChild(span);
      if (i < factText.split(" ").length - 1) fact.appendChild(document.createTextNode(" "));
    });

    function setLabel(text) {
      if (reduceMotion) { label.textContent = text; return; }
      label.classList.add("swap");
      setTimeout(() => {
        label.textContent = text;
        label.classList.remove("swap");
      }, 180);
    }

    const floatEl = scene.querySelector(".float");

    function toggle() {
      const isOpen = scene.classList.toggle("open");
      if (!reduceMotion) {
        if (isOpen) {
          // Congela la flotación en su posición actual y la lleva suavemente a 0.
          const current = getComputedStyle(floatEl).transform;
          floatEl.style.animation = "none";
          floatEl.style.transform = current === "none" ? "translateY(0)" : current;
          void floatEl.offsetWidth;
          floatEl.style.transition = "transform 500ms ease";
          floatEl.style.transform = "translateY(0)";
        } else {
          floatEl.style.transition = "none";
          floatEl.style.transform = "";
          floatEl.style.animation = "";
        }
      }
      setLabel(isOpen ? "Cerrar curiosidad" : "Descubrir curiosidad");
      button.setAttribute("aria-expanded", String(isOpen));
    }

    button.addEventListener("click", (e) => {
      // Onda en el punto del clic.
      if (!reduceMotion) {
        const r = button.getBoundingClientRect();
        const size = Math.max(r.width, r.height);
        const ripple = document.createElement("span");
        ripple.className = "ripple";
        ripple.style.width = ripple.style.height = size + "px";
        ripple.style.left = (e.clientX - r.left - size / 2) + "px";
        ripple.style.top = (e.clientY - r.top - size / 2) + "px";
        button.appendChild(ripple);
        ripple.addEventListener("animationend", () => ripple.remove());
      }
      toggle();
    });

    // También se puede abrir/cerrar tocando los binoculares.
    scene.addEventListener("click", toggle);

    // Parallax suave con el puntero (solo si no se pidió reducir movimiento).
    if (!reduceMotion) {
      scene.addEventListener("pointermove", (e) => {
        const r = scene.getBoundingClientRect();
        const x = ((e.clientX - r.left) / r.width - .5) * 2;
        const y = ((e.clientY - r.top) / r.height - .5) * 2;
        binoculars.style.setProperty("--px", x.toFixed(3));
        binoculars.style.setProperty("--py", y.toFixed(3));
      });
      scene.addEventListener("pointerleave", () => {
        binoculars.style.setProperty("--px", 0);
        binoculars.style.setProperty("--py", 0);
      });
    }

    // Escape cierra la curiosidad.
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && scene.classList.contains("open")) toggle();
    });
  </script>
